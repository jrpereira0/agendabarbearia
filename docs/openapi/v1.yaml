openapi: 3.1.0
info:
  title: Agenda Barbearia API
  version: 1.1.0
  summary: Integrações de agenda (n8n, WhatsApp e app do cliente)
  description: |
    API REST para **conectar o WhatsApp, o n8n ou o app do cliente** à agenda da
    barbearia — as mesmas regras do site `/agenda`.

    **O que dá para fazer**
    - Ver dados da **loja** (`/shop`)
    - Ver **serviços** e **profissionais**
    - Consultar **horários livres**, **criar**, **listar**, **remarcar** e **cancelar**
    - Buscar **cliente** pelo WhatsApp
    - No **app**: ver e **editar o próprio cadastro** (`GET` / `PATCH /customers/me`),
      registrar push (`/customers/me/push-token`), ver notificações (`/customers/me/notifications`)
      e **sair de todos os aparelhos** (`DELETE /customers/me/sessions`)
    - Disparar e confirmar **lembretes** (~1h antes)
    - No **n8n**: ativar/pausar a **IA** por conversa (`/ai-status`)

    Comandas, caixa e comissões ficam **só no painel** — não entram nesta API.

    ## Repetir sem duplicar (Idempotency-Key)

    Em `POST /appointments`, `PATCH /appointments/{id}` e `DELETE /appointments/{id}`,
    envie um header `Idempotency-Key` (qualquer string única por tentativa,
    ex.: um UUID). Se a chamada for repetida com a mesma chave — por exemplo,
    um retry automático depois de um timeout — o servidor devolve a mesma
    resposta da primeira vez em vez de repetir a ação.

    ## Autenticação

    ### Chave de API (n8n / integrações)

    Gere em **Configurações → Integrações → Chaves de API**:

    ```
    Authorization: Bearer dbc_live_<keyId>_<secret>
    ```

    ### Sessão do cliente (site e app)

    1. `POST /api/agenda/otp/send` → código no WhatsApp
    2. `POST /api/agenda/otp/verify` → `{ accessToken, expiresAt }` + cookie httpOnly
    3. Rotas privadas:
       - **Site:** cookie `agenda_client_session`
       - **App:** `Authorization: Bearer <accessToken>`

    | Tipo | Rotas | Regra |
    | --- | --- | --- |
    | **Públicas** | `/shop`, `/services`, `/professionals`, `/appointments/availability` | Sem header OK. Se enviar Bearer de **chave de API**, a chave precisa ser válida. |
    | **Privadas** | `GET /customers`, `GET|PATCH /customers/me`, criar/listar/remarcar/cancelar, status, lembretes | Chave de API **ou** sessão do cliente (cookie / `accessToken`). `/customers/me` é só sessão OTP do app/site. |

    Guias: `docs/api/app-mobile.md`, `docs/api/cliente-otp-whatsapp.md`, `docs/api/guia-n8n.md`.

    ## Formatos

    | Dado | Formato |
    | --- | --- |
    | WhatsApp | DDD + número (10 ou 11 dígitos), com ou sem `55` / máscara → gravado como `55…` |
    | Data | `AAAA-MM-DD` (ex.: `2026-07-22`) |
    | Horário | `HH:MM` 24h (ex.: `14:30`) |
    | Fuso | `America/Sao_Paulo` |

    ## Rate limits

    Excesso → **429** com `Retry-After`. Limites típicos por IP (chave de API: até 120 / 15 min):

    | Rotas | Limite |
    | --- | --- |
    | shop, services, professionals, availability | 60 / 15 min |
    | customers, customers/me, GET appointments | 60 / 15 min |
    | POST appointments | 5/h por IP e 3/h por WhatsApp |
    | PATCH / DELETE appointments | 10 / 15 min |

    ## Erros

    Formato padrão em toda a API: `{ "ok": false, "error": "mensagem" }`.
  contact:
    name: Agenda Barbearia
servers:
  - url: /api/v1
    description: Relativo ao host da aplicação
  - url: https://agendabarbearia-seven.vercel.app/api/v1
    description: Produção
tags:
  - name: Loja
    description: Dados públicos da barbearia (bootstrap do app)
  - name: Serviços
    description: Lista e preços dos serviços ativos
  - name: Profissionais
    description: Lista dos barbeiros ativos e quais serviços cada um faz
  - name: Agendamentos
    description: Horários livres → criar → listar → status → remarcar → cancelar
  - name: Clientes
    description: |
      Buscar cliente pelo WhatsApp e, no app, ver/editar o próprio cadastro
      (`/customers/me` — nome e sobrenome; WhatsApp imutável).
  - name: Lembretes
    description: Lembretes automáticos ~1h antes do horário (disparo e confirmação no WhatsApp)
  - name: Notificações
    description: Push (Expo) e inbox de notificações do app do cliente
  - name: IA
    description: Ativar/pausar o atendimento por IA numa conversa de WhatsApp (n8n)
security:
  - BearerAuth: []
paths:
  /shop:
    get:
      tags: [Loja]
      operationId: getShop
      summary: Dados públicos da loja
      description: |
        Nome, contato, logo, fuso, intervalo de slots, janela de agendamento
        e horários de funcionamento. Ideal na abertura do app.

        **Acesso:** público. Scope opcional `catalog:read`.
      security: []
      responses:
        "200":
          description: Dados da loja
          content:
            application/json:
              schema:
                type: object
                required: [ok, shop, businessHours]
                properties:
                  ok:
                    type: boolean
                  shop:
                    type: object
                    properties:
                      name:
                        type: string
                      bio:
                        type: string
                        nullable: true
                      address:
                        type: string
                        nullable: true
                      whatsapp:
                        type: string
                        nullable: true
                      instagram:
                        type: string
                        nullable: true
                      logoUrl:
                        type: string
                        nullable: true
                      timezone:
                        type: string
                        example: America/Sao_Paulo
                      slotStepMinutes:
                        type: integer
                        example: 30
                      booking:
                        type: object
                        properties:
                          maxDaysAhead:
                            type: integer
                            example: 60
                  businessHours:
                    type: array
                    items:
                      type: object
                      properties:
                        weekday:
                          type: integer
                          minimum: 0
                          maximum: 6
                        label:
                          type: string
                        active:
                          type: boolean
                        openTime:
                          type: string
                          example: "09:00"
                        closeTime:
                          type: string
                          example: "19:00"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /services:
    get:
      tags: [Serviços]
      operationId: listServices
      summary: Listar serviços ativos
      description: |
        Lista os serviços que a barbearia oferece hoje: nome, duração, foto,
        preços por dia da semana e quem realiza cada um.

        Opcional:
        - `professionalId` — só o que aquele barbeiro faz
        - `date` — preenche o preço daquele dia (`priceCentsForDate`)

        **Acesso:** pública. Com chave, scope `catalog:read`.
      security: []
      parameters:
        - name: professionalId
          in: query
          description: Filtra pelos serviços que esse barbeiro realiza
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          description: Dia AAAA-MM-DD para calcular o preço da data
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Lista de serviços
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  timezone:
                    type: string
                    example: America/Sao_Paulo
                  dayLabels:
                    type: array
                    items:
                      type: string
                    example: [Dom, Seg, Ter, Qua, Qui, Sex, Sab]
                  date:
                    type: string
                    nullable: true
                    format: date
                  weekday:
                    type: integer
                    nullable: true
                  services:
                    type: array
                    items:
                      $ref: "#/components/schemas/Service"
              example:
                ok: true
                timezone: America/Sao_Paulo
                dayLabels: [Dom, Seg, Ter, Qua, Qui, Sex, Sab]
                date: null
                weekday: null
                services:
                  - id: 9f135f0a-6894-4062-91df-06233c18d10e
                    name: Barbaterapia
                    description: ""
                    durationMinutes: 30
                    priceCents: 6000
                    priceCentsForDate: null
                    priceFrom: false
                    prices:
                      - priceCents: 6000
                        weekdays: [1, 2, 3]
                        days: [Seg, Ter, Qua]
                      - priceCents: 6500
                        weekdays: [4, 5, 6]
                        days: [Qui, Sex, Sab]
                    photoUrl: null
                    professionalIds:
                      - 054a545a-75c8-4807-b72d-5c460bb3539f
                    professionals:
                      - id: 054a545a-75c8-4807-b72d-5c460bb3539f
                        nickname: Junior
                        photoUrl: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /professionals:
    get:
      tags: [Profissionais]
      operationId: listProfessionals
      summary: Listar profissionais ativos
      description: |
        Lista os barbeiros ativos para escolha no agendamento: apelido, foto
        e os IDs dos serviços que cada um realiza (`serviceIds`).

        Detalhes de preço e duração dos serviços ficam em `GET /services`.
        Opcional: `serviceId` para listar só quem faz aquele serviço.

        **Acesso:** pública. Com chave, scope `catalog:read`.
      security: []
      parameters:
        - name: serviceId
          in: query
          description: Filtra pelos barbeiros que realizam este serviço
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista de profissionais
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  timezone:
                    type: string
                  professionals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Professional"
              example:
                ok: true
                timezone: America/Sao_Paulo
                professionals:
                  - id: 054a545a-75c8-4807-b72d-5c460bb3539f
                    nickname: Junior
                    photoUrl: null
                    serviceIds:
                      - 3a62b091-6916-4741-a3d4-754a33b2cb31
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /customers/me:
    get:
      tags: [Clientes]
      operationId: getMyCustomerProfile
      summary: Meu cadastro (app)
      description: |
        Devolve o cadastro do cliente autenticado pela sessão OTP
        (`Authorization: Bearer <accessToken>`).

        Se ainda não houver cadastro, `found` vem `false` e `customer` é `null`.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Cadastro encontrado ou não
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  found:
                    type: boolean
                  customer:
                    oneOf:
                      - $ref: "#/components/schemas/Customer"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [Clientes]
      operationId: updateMyCustomerProfile
      summary: Atualizar meu cadastro (app)
      description: |
        Atualiza nome e sobrenome do cliente autenticado.
        O WhatsApp não muda (é o da sessão).
        Scope da sessão: `customers:update`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName]
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
            example:
              firstName: João
              lastName: Silva
      responses:
        "200":
          description: Cadastro atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  customer:
                    $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /customers/me/sessions:
    delete:
      tags: [Clientes]
      operationId: logoutAllMyCustomerSessions
      summary: Sair de todos os aparelhos (app)
      description: |
        Invalida o cookie de sessão do site e todo `accessToken` do app já
        emitido pra esse WhatsApp — inclusive o usado nesta própria chamada.
        Útil se o cliente perdeu o celular ou acha que alguém mais tem acesso.

        Depois disso, cada aparelho precisa refazer o login por OTP
        (`POST /agenda/otp/send` + `/agenda/otp/verify`) pra continuar usando.

        Scope da sessão: `customers:update`.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Sessões encerradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /customers:
    get:
      tags: [Clientes]
      operationId: getCustomerByWhatsapp
      summary: Buscar cliente
      description: |
        Busca o cliente pelo WhatsApp e devolve só o essencial:
        `id`, `firstName`, `lastName` e `whatsapp`.

        Se não achar, `found` vem `false` e `customer` é `null`
        (aí o fluxo pede nome e sobrenome).

        **Acesso:** privada. Scope `customers:read`.
        - Chave de API (n8n) ou dono do painel: qualquer WhatsApp
        - Sessão OTP do cliente: só o **próprio** WhatsApp

        No app, preferir `GET /customers/me` (não precisa passar WhatsApp na URL).
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/whatsappQuery"
      responses:
        "200":
          description: Cliente encontrado ou não
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  found:
                    type: boolean
                  customer:
                    oneOf:
                      - $ref: "#/components/schemas/Customer"
                      - type: "null"
              examples:
                found:
                  value:
                    ok: true
                    found: true
                    customer:
                      id: 22222222-2222-2222-2222-222222222222
                      firstName: João
                      lastName: Silva
                      whatsapp: "5511999999999"
                notFound:
                  value:
                    ok: true
                    found: false
                    customer: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /appointments/availability:
    get:
      tags: [Agendamentos]
      operationId: getAvailability
      summary: Consultar horários livres
      description: |
        Devolve os horários em que ainda dá para marcar um atendimento
        na data pedida, já considerando funcionamento da loja, grade do
        barbeiro, duração dos serviços e agendamentos existentes.

        Use antes de criar ou remarcar um horário.

        **Como pedir**
        - Com barbeiro escolhido: envie `professionalId`
        - Sem preferência de barbeiro: envie `anyProfessional=1`
          (une os horários de quem faz os serviços)

        **Acesso:** pública (site e bots). Se enviar chave de API,
        precisa do scope `availability:read`.
      security: []
      parameters:
        - name: date
          in: query
          required: true
          description: Dia do atendimento no formato AAAA-MM-DD
          schema:
            type: string
            format: date
        - name: serviceIds
          in: query
          required: true
          description: |
            Um ou mais IDs de serviço separados por vírgula.
            A duração total desses serviços define o tamanho do horário.
          schema:
            type: string
          example: 3a62b091-6916-4741-a3d4-754a33b2cb31
        - name: professionalId
          in: query
          description: ID do barbeiro. Obrigatório se não usar `anyProfessional`.
          schema:
            type: string
            format: uuid
        - name: anyProfessional
          in: query
          description: |
            Use `1` para buscar horários em qualquer barbeiro que realize
            os serviços (quando o cliente não escolheu ninguém específico).
          schema:
            type: string
            enum: ["1", "true", "yes"]
        - name: excludeAppointmentId
          in: query
          description: |
            Na remarcação, informe o ID do próprio agendamento para ele
            não ocupar o horário atual no cálculo.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: |
            Lista de horários livres em `slots` (ex.: `09:00`, `09:30`).
            Se não houver vaga, `available` vem `false` com uma mensagem.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  professionalId:
                    type: string
                    format: uuid
                    nullable: true
                  date:
                    type: string
                    format: date
                  durationMinutes:
                    type: integer
                  totalPriceCents:
                    type: integer
                  slots:
                    type: array
                    items:
                      type: string
                      example: "14:30"
                  available:
                    type: boolean
                  unavailableReason:
                    type: string
                    nullable: true
                  message:
                    type: string
                  workingPeriods:
                    type: array
                    items:
                      type: object
                      properties:
                        startTime:
                          type: string
                        endTime:
                          type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /appointments:
    post:
      tags: [Agendamentos]
      operationId: createAppointment
      summary: Criar agendamento
      description: |
        Marca um novo horário para o cliente (nome, WhatsApp, serviços, data e hora).

        Antes de chamar, use `GET /appointments/availability` para garantir
        que o horário ainda está livre. O servidor valida de novo ao gravar.

        Informe o barbeiro (`professionalId`) **ou** `anyProfessional: true`
        para o sistema escolher alguém disponível.

        **Acesso:** privada. Scope `appointments:create`
        (chave de API, cookie OTP ou `Bearer` com `accessToken` do OTP).

        Recomendado enviar `Idempotency-Key` (ver parâmetro) pra evitar
        marcar o mesmo horário duas vezes num retry.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentBody"
            example:
              anyProfessional: true
              date: "2026-07-23"
              startTime: "10:00"
              serviceIds:
                - 3a62b091-6916-4741-a3d4-754a33b2cb31
              firstName: João
              lastName: Silva
              whatsapp: "11999999999"
      responses:
        "200":
          description: Agendamento criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  appointmentId:
                    type: string
                    format: uuid
                  professionalId:
                    type: string
                    format: uuid
                  professionalNickname:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    get:
      tags: [Agendamentos]
      operationId: listAppointments
      summary: Listar agendamentos do cliente
      description: |
        Lista os agendamentos de um cliente pelo WhatsApp.

        - `mode=upcoming` (padrão): só futuros ativos — usado pelo site "Meus horários"
        - `mode=history`: passados, cancelados e concluídos
        - `mode=all`: todos os status (até 50)

        **Acesso:** privada. Scope `appointments:read`
        (chave de API, dono, cookie OTP ou `Bearer` com `accessToken`).
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/whatsappQuery"
        - name: mode
          in: query
          description: upcoming | history | all
          schema:
            type: string
            enum: [upcoming, history, all]
            default: upcoming
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  mode:
                    type: string
                    enum: [upcoming, history, all]
                  appointments:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicAppointment"
              example:
                ok: true
                mode: upcoming
                appointments:
                  - id: 11111111-1111-1111-1111-111111111111
                    professionalId: 054a545a-75c8-4807-b72d-5c460bb3539f
                    professionalName: Junior
                    professionalPhotoUrl: null
                    date: "2026-07-23"
                    startTime: "10:00"
                    status: scheduled
                    serviceIds:
                      - 3a62b091-6916-4741-a3d4-754a33b2cb31
                    serviceNames: [Corte]
                    totalMinutes: 30
                    totalPriceCents: 6000
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /appointments/last-completed:
    get:
      tags: [Agendamentos]
      operationId: getLastCompletedAppointment
      summary: Último atendimento concluído
      description: |
        Devolve o último horário já atendido (`done`) daquele WhatsApp.
        Útil no bot para lembrar serviço/barbeiro preferido e sugerir remarcar.

        **Acesso:** privada. Scope `appointments:read`
        (chave de API, dono, cookie OTP ou `Bearer` com `accessToken`).
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/whatsappQuery"
      responses:
        "200":
          description: Último atendimento ou não encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  found:
                    type: boolean
                  lastAppointment:
                    type: object
                    nullable: true
                    additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /appointments/{id}/status:
    parameters:
      - $ref: "#/components/parameters/appointmentId"
    put:
      tags: [Agendamentos]
      operationId: updateAppointmentStatus
      summary: Atualizar status do agendamento
      description: |
        Muda o andamento do horário na agenda, por exemplo de agendado para
        confirmado, cancelado ou atendido.

        Status aceitos: `scheduled`, `confirmed`, `cancelled`, `done`.

        **Acesso:** privada — chave com `appointments:update` ou sessão do dono.
        O cliente do site não usa esta rota (para cancelar, use DELETE).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [scheduled, confirmed, cancelled, done]
            example:
              status: confirmed
      responses:
        "200":
          description: Status atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  appointmentId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [scheduled, confirmed, cancelled, done]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /appointments/{id}:
    parameters:
      - $ref: "#/components/parameters/appointmentId"
    patch:
      tags: [Agendamentos]
      operationId: updateAppointment
      summary: Remarcar agendamento
      description: |
        Troca data, horário, barbeiro e/ou serviços de um agendamento já existente.
        O WhatsApp do body precisa ser o do dono do horário.

        **Acesso:** privada. Scope `appointments:update`
        (chave de API, dono, cookie OTP ou `Bearer` com `accessToken`).
        WhatsApp do body deve ser o da sessão do cliente.

        Recomendado enviar `Idempotency-Key` (ver parâmetro) pra evitar
        remarcar em duplicidade num retry.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [whatsapp, professionalId, date, startTime, serviceIds]
              properties:
                whatsapp:
                  type: string
                professionalId:
                  type: string
                  format: uuid
                date:
                  type: string
                  format: date
                startTime:
                  type: string
                  example: "15:00"
                serviceIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
      responses:
        "200":
          description: Remarcado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  appointmentId:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Agendamentos]
      operationId: cancelAppointment
      summary: Cancelar agendamento
      description: |
        Cancela o horário do cliente. O registro continua no sistema com status
        `cancelled` (não apaga o histórico).

        **Acesso:** privada. Scope `appointments:cancel`
        (chave de API, dono, cookie OTP ou `Bearer` com `accessToken`).
        WhatsApp da query deve ser o da sessão do cliente.

        Recomendado enviar `Idempotency-Key` (ver parâmetro) pra evitar
        cancelar em duplicidade num retry.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/whatsappQuery"
        - $ref: "#/components/parameters/idempotencyKeyHeader"
      responses:
        "200":
          description: Cancelado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  appointmentId:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /appointment-reminders/due:
    get:
      tags: [Lembretes]
      operationId: listDueReminders
      summary: Lembretes vencidos para disparo
      description: |
        Lista lembretes que já chegaram na hora de avisar o cliente
        (cerca de 1h antes do atendimento). O n8n consulta esta rota,
        envia a mensagem no WhatsApp e depois marca como enviado.

        **Acesso:** privada. Scope `appointment_reminders:read`.
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: now
          in: query
          description: ISO-8601 com offset (opcional, para testes)
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Lista de lembretes
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  reminders:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppointmentReminder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /appointment-reminders/pending-response:
    get:
      tags: [Lembretes]
      operationId: getPendingReminderResponse
      summary: Lembrete aguardando confirmação do cliente
      description: |
        Depois que o lembrete foi enviado, busca se aquele WhatsApp ainda tem
        um lembrete esperando a resposta do cliente (confirmar presença).

        **Acesso:** privada. Scope `appointment_reminders:read`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/whatsappQuery"
      responses:
        "200":
          description: Lembrete pendente ou null
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  found:
                    type: boolean
                  reminder:
                    oneOf:
                      - $ref: "#/components/schemas/AppointmentReminder"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /appointment-reminders/{id}/mark-sent:
    post:
      tags: [Lembretes]
      operationId: markReminderSent
      summary: Marcar lembrete como enviado
      description: |
        Confirma no sistema que a mensagem do lembrete já saiu no WhatsApp.
        Chame logo depois do envio no n8n para não disparar de novo.

        **Acesso:** privada. Scope `appointment_reminders:write`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                providerMessageId:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /appointment-reminders/{id}/confirm:
    post:
      tags: [Lembretes]
      operationId: confirmReminder
      summary: Confirmar lembrete pelo cliente
      description: |
        Quando o cliente responde confirmando o horário, marque o lembrete
        como confirmado. Assim o fluxo do bot sabe que a presença foi ok.

        **Acesso:** privada. Scope `appointment_reminders:write`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /customers/me/push-token:
    post:
      tags: [Notificações]
      operationId: registerPushToken
      summary: Registrar token de push (app)
      description: |
        Guarda o Expo Push Token do aparelho do cliente logado, pra receber
        avisos (ex.: lembrete de horário) mesmo com o app fechado.

        **Acesso:** privada, só sessão OTP do app. Scope `customers:update`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expoPushToken]
              properties:
                expoPushToken:
                  type: string
                  example: "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]"
                platform:
                  type: string
                  example: ios
      responses:
        "200":
          description: Token salvo
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Notificações]
      operationId: deletePushToken
      summary: Remover token de push (app)
      description: |
        Remove o token do aparelho (logout ou permissão de notificação
        revogada). Sem `expoPushToken` no corpo, remove todos os tokens
        salvos daquele cliente.

        **Acesso:** privada, só sessão OTP do app. Scope `customers:update`.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expoPushToken:
                  type: string
      responses:
        "200":
          description: Token removido
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /customers/me/notifications:
    get:
      tags: [Notificações]
      operationId: listMyNotifications
      summary: Listar notificações (inbox do app)
      description: |
        Lista as notificações in-app do cliente logado (mais recentes
        primeiro), com a contagem de não lidas.

        **Acesso:** privada, só sessão OTP do app. Scope `customers:read`.
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Lista de notificações
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  unreadCount:
                    type: integer
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomerNotification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [Notificações]
      operationId: markAllNotificationsRead
      summary: Marcar todas as notificações como lidas
      description: |
        Marca todas as notificações não lidas do cliente logado como lidas.

        **Acesso:** privada, só sessão OTP do app. Scope `customers:update`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [markAllRead]
              properties:
                markAllRead:
                  type: boolean
                  enum: [true]
            example:
              markAllRead: true
      responses:
        "200":
          description: Quantidade marcada como lida
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  updated:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /customers/me/notifications/{id}/read:
    patch:
      tags: [Notificações]
      operationId: markNotificationRead
      summary: Marcar uma notificação como lida
      description: |
        **Acesso:** privada, só sessão OTP do app. Scope `customers:update`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Marcada como lida
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ai-status:
    get:
      tags: [IA]
      operationId: getAiStatus
      summary: Consultar se a IA está ativa numa conversa
      description: |
        Devolve se o atendimento por IA está ativo ou pausado naquele
        WhatsApp. Sem registro salvo, a IA é considerada ativa (`true`).

        Pensada pra substituir o acesso direto do n8n ao banco (Postgres)
        por uma chave de API com escopo próprio.

        **Acesso:** privada. Scope `ai_status:read`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/whatsappQuery"
      responses:
        "200":
          description: Status da IA na conversa
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  whatsapp:
                    type: string
                  iaAtiva:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [IA]
      operationId: setAiStatus
      summary: Ativar ou pausar a IA numa conversa
      description: |
        Liga ou pausa o atendimento por IA num WhatsApp — por exemplo,
        quando um humano assume a conversa e a IA deve parar de responder.

        **Acesso:** privada. Scope `ai_status:write`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [whatsapp, iaAtiva]
              properties:
                whatsapp:
                  type: string
                iaAtiva:
                  type: boolean
            example:
              whatsapp: "11999999999"
              iaAtiva: false
      responses:
        "200":
          description: Status atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  whatsapp:
                    type: string
                  iaAtiva:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: dbc_live_… ou accessToken do OTP
      description: |
        Dois tipos de Bearer:
        1. **Chave de API** (`dbc_live_<keyId>_<secret>`) — n8n / integrações
        2. **Sessão do cliente** (`accessToken` de `POST /api/agenda/otp/verify`) — app mobile

        Exemplo: `Authorization: Bearer <token>`

        `/customers/me` aceita **somente** o token de sessão do cliente (não chave de API).

  parameters:
    whatsappQuery:
      name: whatsapp
      in: query
      required: true
      schema:
        type: string
      example: "11999999999"
      description: WhatsApp com DDD (com ou sem 55)
    appointmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    idempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Chave opcional escolhida por quem chama (ex.: um UUID gerado antes
        de enviar). Se a mesma chamada for repetida com a mesma chave — por
        exemplo, um retry por timeout de rede do app ou do n8n — o servidor
        devolve a resposta salva da primeira vez, em vez de repetir a ação
        (evita agendamento duplicado). Reusar a chave com dados diferentes
        dá **409**.
      schema:
        type: string
        maxLength: 200

  schemas:
    Error:
      type: object
      description: |
        Formato de erro padrão de toda a API: `ok` sempre `false` e `error`
        com uma mensagem em português pronta pra mostrar pro usuário.
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string
    Professional:
      type: object
      description: |
        Dados públicos do profissional. Contato interno (e-mail, WhatsApp do barbeiro),
        nome/sobrenome e comissão não entram nesta rota pública.
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        photoUrl:
          type: string
          nullable: true
        serviceIds:
          type: array
          description: IDs dos serviços que realiza (detalhes em GET /services)
          items:
            type: string
            format: uuid
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
        priceCents:
          type: integer
          description: Menor preço da semana (referência)
        priceCentsForDate:
          type: integer
          nullable: true
          description: Preço do dia em ?date= (null sem date)
        priceFrom:
          type: boolean
        prices:
          type: array
          description: Preços agrupados por valor
          items:
            type: object
            properties:
              priceCents:
                type: integer
              weekdays:
                type: array
                items:
                  type: integer
                description: "0=Dom … 6=Sáb"
              days:
                type: array
                items:
                  type: string
                example: [Seg, Ter, Qua]
        photoUrl:
          type: string
          nullable: true
        professionalIds:
          type: array
          description: IDs dos profissionais que realizam este serviço
          items:
            type: string
            format: uuid
        professionals:
          type: array
          description: Resumo público de quem realiza (sem serviceIds aninhados)
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              nickname:
                type: string
              photoUrl:
                type: string
                nullable: true
    Customer:
      type: object
      description: Dados essenciais do cliente (cadastro + crédito na loja)
      required: [id, firstName, lastName, whatsapp, creditBalanceCents]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        whatsapp:
          type: string
          example: "5511999999999"
        creditBalanceCents:
          type: integer
          description: Saldo de crédito na loja, em centavos
          example: 5000
    CustomerNotification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        type:
          type: string
          example: appointment_reminder
        data:
          type: object
          additionalProperties: true
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    PublicAppointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        professionalId:
          type: string
          format: uuid
        professionalName:
          type: string
        professionalPhotoUrl:
          type: string
          nullable: true
        date:
          type: string
          format: date
        startTime:
          type: string
        status:
          type: string
          enum: [scheduled, confirmed, cancelled, done]
        serviceIds:
          type: array
          items:
            type: string
            format: uuid
        serviceNames:
          type: array
          items:
            type: string
        totalMinutes:
          type: integer
        totalPriceCents:
          type: integer
    CreateAppointmentBody:
      type: object
      required: [date, startTime, serviceIds, firstName, lastName, whatsapp]
      properties:
        professionalId:
          type: string
          format: uuid
        anyProfessional:
          type: boolean
        date:
          type: string
          format: date
        startTime:
          type: string
          example: "10:00"
        serviceIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        firstName:
          type: string
        lastName:
          type: string
        whatsapp:
          type: string
    AppointmentReminder:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        reminderType:
          type: string
          enum: [one_hour_before, thirty_minutes_before]
          description: Tipo do lembrete (1h ou 30min antes)
        scheduledFor:
          type: string
          format: date-time
        customer:
          type: object
          properties:
            firstName:
              type: string
            lastName:
              type: string
            whatsapp:
              type: string
        professional:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        services:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              priceCents:
                type: integer
        shop:
          type: object
          properties:
            name:
              type: string
            address:
              type: string

  responses:
    BadRequest:
      description: Parâmetros inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Não autorizado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            ok: false
            error: Não autorizado.
    Forbidden:
      description: Sem permissão
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            ok: false
            error: Sem permissão.
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflito de regra de negócio
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit excedido
      headers:
        Retry-After:
          schema:
            type: integer
          description: Segundos até tentar de novo
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Muitas tentativas em pouco tempo. Aguarde alguns minutos e tente de novo.
    ServiceUnavailable:
      description: Sistema indisponível
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Sistema indisponível no momento.
