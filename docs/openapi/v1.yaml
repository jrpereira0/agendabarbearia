openapi: 3.1.0
info:
  title: Agenda Barbearia API
  version: 1.0.0
  summary: API de agendamento, lembretes e financeiro
  description: |
    API do Agenda Barbearia para integrar o negócio com n8n, WhatsApp, bots e apps.

    Aqui você consulta catálogo, horários livres, cria e gerencia agendamentos,
    dispara lembretes, cuida de comandas e consulta caixa/comissões.

    ## Autenticação

    Gere a chave no painel: **Configurações → Integrações → Chaves de API**.

    ```
    Authorization: Bearer dbc_live_<keyId>_<secret>
    ```

    - **Rotas públicas** (`/catalog`, `/services`, `/professionals`, `/appointments/availability`, `/customers/lookup`, `POST /appointments`):
      funcionam sem header. Se enviar `Bearer`, a chave deve ser válida e ter o scope.
    - **Rotas privadas**: exigem chave de API, sessão do painel ou cookie de cliente
      (Meus horários no site).

    ## Formatos

    - **WhatsApp:** DDD + número (10 ou 11 dígitos), com ou sem `55` / máscara. Gravado como `55…`.
    - **Datas:** `AAAA-MM-DD` (ex.: `2026-07-22`)
    - **Horários:** `HH:MM` 24h (ex.: `14:30`)
    - **Fuso:** `America/Sao_Paulo`

    ## Rate limits

    Excesso → **429** com `Retry-After`. Limites típicos por IP (chave de API: até 120/15 min):

    | Rotas | Limite |
    | --- | --- |
    | catalog, services, professionals, appointments/availability | 60 / 15 min |
    | customers/*, GET appointments | 10 / 15 min |
    | POST appointments | 5/h por IP e 3/h por WhatsApp |
    | PATCH/DELETE appointments | 10 / 15 min |

    ## Erros

    Respostas de erro em JSON: `{ "error": "mensagem" }` ou `{ "ok": false, "error": "..." }`.

    Guias narrativos (webhooks, fluxo n8n): veja `docs/api/` no repositório.
  contact:
    name: Agenda Barbearia
servers:
  - url: /api/v1
    description: Relativo ao host da aplicação
  - url: https://agendabarbearia-seven.vercel.app/api/v1
    description: Produção
tags:
  - name: Catálogo
    description: Dados gerais da barbearia (loja, barbeiros, serviços e funcionamento) num único pacote
  - name: Serviços
    description: Lista e preços dos serviços ativos
  - name: Profissionais
    description: Lista dos barbeiros ativos e quais serviços cada um faz
  - name: Agendamentos
    description: Horários livres, criar, listar/histórico, atualizar status, remarcar e cancelar
  - name: Clientes
    description: Buscar cliente pelo WhatsApp (site ou n8n)
  - name: Lembretes
    description: Lembretes automáticos ~1h antes do horário (disparo e confirmação no WhatsApp)
  - name: Comandas
    description: Conta do cliente no dia — itens, fechar e reabrir
  - name: Financeiro
    description: Caixa do dia e comissões por barbeiro
security:
  - BearerAuth: []
paths:
  /catalog:
    get:
      tags: [Catálogo]
      operationId: getCatalog
      summary: Catálogo completo ou enxuto para booking
      description: |
        Devolve num único pacote os dados públicos da barbearia: loja, barbeiros,
        serviços (com preços) e horário de funcionamento.

        Use no site ou quando a integração precisa de tudo de uma vez.
        Para bots/IA, prefira `mode=booking` (payload menor, preços agrupados).
        Com `date`, os preços já vêm do dia escolhido.

        **Acesso:** pública. Com chave, scope `catalog:read`.
      security: []
      parameters:
        - name: mode
          in: query
          description: Use `booking` para resposta enxuta (bots/IA)
          schema:
            type: string
            enum: [booking]
        - name: date
          in: query
          description: Dia AAAA-MM-DD — no mode=booking, preços já vêm desse dia
          schema:
            type: string
            format: date
        - name: professionalId
          in: query
          description: Filtra serviços/barbeiros relacionados a este profissional
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Catálogo
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                timezone: America/Sao_Paulo
                shop:
                  name: Dinho Barber Coffee
                  slotStepMinutes: 30
                professionals:
                  - id: 054a545a-75c8-4807-b72d-5c460bb3539f
                    nickname: Junior
                    serviceIds: []
                services: []
                businessHours: []
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /services:
    get:
      tags: [Serviços]
      operationId: listServices
      summary: Listar serviços ativos
      description: |
        Lista os serviços que a barbearia oferece hoje: nome, duração, foto,
        preços por dia da semana e quem realiza cada um.

        Opcional:
        - `professionalId` — só o que aquele barbeiro faz
        - `date` — preenche o preço daquele dia (`priceCentsForDate`)

        **Acesso:** pública. Com chave, scope `catalog:read`.
      security: []
      parameters:
        - name: professionalId
          in: query
          description: Filtra pelos serviços que esse barbeiro realiza
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          description: Dia AAAA-MM-DD para calcular o preço da data
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Lista de serviços
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  timezone:
                    type: string
                    example: America/Sao_Paulo
                  dayLabels:
                    type: array
                    items:
                      type: string
                    example: [Dom, Seg, Ter, Qua, Qui, Sex, Sab]
                  date:
                    type: string
                    nullable: true
                    format: date
                  weekday:
                    type: integer
                    nullable: true
                  services:
                    type: array
                    items:
                      $ref: "#/components/schemas/Service"
              example:
                ok: true
                timezone: America/Sao_Paulo
                dayLabels: [Dom, Seg, Ter, Qua, Qui, Sex, Sab]
                date: null
                weekday: null
                services:
                  - id: 9f135f0a-6894-4062-91df-06233c18d10e
                    name: Barbaterapia
                    description: ""
                    durationMinutes: 30
                    priceCents: 6000
                    priceCentsForDate: null
                    priceFrom: false
                    prices:
                      - priceCents: 6000
                        weekdays: [1, 2, 3]
                        days: [Seg, Ter, Qua]
                      - priceCents: 6500
                        weekdays: [4, 5, 6]
                        days: [Qui, Sex, Sab]
                    photoUrl: null
                    professionalIds:
                      - 054a545a-75c8-4807-b72d-5c460bb3539f
                    professionals:
                      - id: 054a545a-75c8-4807-b72d-5c460bb3539f
                        nickname: Junior
                        photoUrl: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /professionals:
    get:
      tags: [Profissionais]
      operationId: listProfessionals
      summary: Listar profissionais ativos
      description: |
        Lista os barbeiros ativos para escolha no agendamento: apelido, foto
        e os IDs dos serviços que cada um realiza (`serviceIds`).

        Detalhes de preço e duração dos serviços ficam em `GET /services`.
        Opcional: `serviceId` para listar só quem faz aquele serviço.

        **Acesso:** pública. Com chave, scope `catalog:read`.
      security: []
      parameters:
        - name: serviceId
          in: query
          description: Filtra pelos barbeiros que realizam este serviço
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista de profissionais
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  timezone:
                    type: string
                  professionals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Professional"
              example:
                ok: true
                timezone: America/Sao_Paulo
                professionals:
                  - id: 054a545a-75c8-4807-b72d-5c460bb3539f
                    nickname: Junior
                    photoUrl: null
                    serviceIds:
                      - 3a62b091-6916-4741-a3d4-754a33b2cb31
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /customers/lookup:
    get:
      tags: [Clientes]
      operationId: lookupCustomer
      summary: Buscar cliente (resposta simples)
      description: |
        Verifica se o WhatsApp já está cadastrado e devolve só o nome
        (sem o `id` interno). Usado pelo site `/agenda` na hora de confirmar.

        Se não achar, `found` vem `false` — aí o fluxo pede nome e sobrenome.

        **Acesso:** pública. Com chave, scope `customers:read`.
      security: []
      parameters:
        - $ref: "#/components/parameters/whatsappQuery"
      responses:
        "200":
          description: Resultado da busca
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [found, firstName, lastName]
                    properties:
                      found:
                        const: true
                      firstName:
                        type: string
                      lastName:
                        type: string
                  - type: object
                    required: [found]
                    properties:
                      found:
                        const: false
              examples:
                found:
                  value:
                    found: true
                    firstName: João
                    lastName: Silva
                notFound:
                  value:
                    found: false
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /customers/by-whatsapp:
    get:
      tags: [Clientes]
      operationId: getCustomerByWhatsapp
      summary: Buscar cliente com id (n8n)
      description: |
        Busca o cliente pelo WhatsApp e devolve também o `id` do cadastro.
        Preferível no n8n/bot quando a automação precisa guardar ou relacionar o cliente.

        **Acesso:** privada. Scope `customers:read`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/whatsappQuery"
      responses:
        "200":
          description: Cliente encontrado ou não
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  found:
                    type: boolean
                  customer:
                    oneOf:
                      - $ref: "#/components/schemas/Customer"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /appointments/availability:
    get:
      tags: [Agendamentos]
      operationId: getAvailability
      summary: Consultar horários livres
      description: |
        Devolve os horários em que ainda dá para marcar um atendimento
        na data pedida, já considerando funcionamento da loja, grade do
        barbeiro, duração dos serviços e agendamentos existentes.

        Use antes de criar ou remarcar um horário.

        **Como pedir**
        - Com barbeiro escolhido: envie `professionalId`
        - Sem preferência de barbeiro: envie `anyProfessional=1`
          (une os horários de quem faz os serviços)

        **Acesso:** pública (site e bots). Se enviar chave de API,
        precisa do scope `availability:read`.
      security: []
      parameters:
        - name: date
          in: query
          required: true
          description: Dia do atendimento no formato AAAA-MM-DD
          schema:
            type: string
            format: date
        - name: serviceIds
          in: query
          required: true
          description: |
            Um ou mais IDs de serviço separados por vírgula.
            A duração total desses serviços define o tamanho do horário.
          schema:
            type: string
          example: 3a62b091-6916-4741-a3d4-754a33b2cb31
        - name: professionalId
          in: query
          description: ID do barbeiro. Obrigatório se não usar `anyProfessional`.
          schema:
            type: string
            format: uuid
        - name: anyProfessional
          in: query
          description: |
            Use `1` para buscar horários em qualquer barbeiro que realize
            os serviços (quando o cliente não escolheu ninguém específico).
          schema:
            type: string
            enum: ["1", "true", "yes"]
        - name: excludeAppointmentId
          in: query
          description: |
            Na remarcação, informe o ID do próprio agendamento para ele
            não ocupar o horário atual no cálculo.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: |
            Lista de horários livres em `slots` (ex.: `09:00`, `09:30`).
            Se não houver vaga, `available` vem `false` com uma mensagem.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  professionalId:
                    type: string
                    format: uuid
                    nullable: true
                  date:
                    type: string
                    format: date
                  durationMinutes:
                    type: integer
                  totalPriceCents:
                    type: integer
                  slots:
                    type: array
                    items:
                      type: string
                      example: "14:30"
                  available:
                    type: boolean
                  unavailableReason:
                    type: string
                    nullable: true
                  message:
                    type: string
                  workingPeriods:
                    type: array
                    items:
                      type: object
                      properties:
                        startTime:
                          type: string
                        endTime:
                          type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /appointments:
    get:
      tags: [Agendamentos]
      operationId: listAppointments
      summary: Consultar histórico de agendamentos
      description: |
        Lista os agendamentos de um cliente pelo WhatsApp.

        - `mode=upcoming` (padrão): só futuros ativos — usado pelo site "Meus horários"
        - `mode=history`: passados, cancelados e concluídos
        - `mode=all`: todos os status (até 50)

        **Acesso:** privada. Scope `appointments:read` (chave, dono ou cookie do cliente).
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/whatsappQuery"
        - name: mode
          in: query
          description: upcoming | history | all
          schema:
            type: string
            enum: [upcoming, history, all]
            default: upcoming
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  mode:
                    type: string
                    enum: [upcoming, history, all]
                  appointments:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicAppointment"
              example:
                ok: true
                mode: upcoming
                appointments:
                  - id: 11111111-1111-1111-1111-111111111111
                    professionalId: 054a545a-75c8-4807-b72d-5c460bb3539f
                    professionalName: Junior
                    professionalPhotoUrl: null
                    professionalPhotoPosition: 50% 50%
                    date: "2026-07-23"
                    startTime: "10:00"
                    status: scheduled
                    serviceIds:
                      - 3a62b091-6916-4741-a3d4-754a33b2cb31
                    serviceNames: [Corte]
                    totalMinutes: 30
                    totalPriceCents: 6000
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Agendamentos]
      operationId: createAppointment
      summary: Criar agendamento
      description: |
        Marca um novo horário para o cliente (nome, WhatsApp, serviços, data e hora).

        Antes de chamar, use `GET /appointments/availability` para garantir
        que o horário ainda está livre. O servidor valida de novo ao gravar.

        Informe o barbeiro (`professionalId`) **ou** `anyProfessional: true`
        para o sistema escolher alguém disponível.

        **Acesso:** pública (site). Com chave de API, scope `appointments:create`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentBody"
            example:
              anyProfessional: true
              date: "2026-07-23"
              startTime: "10:00"
              serviceIds:
                - 3a62b091-6916-4741-a3d4-754a33b2cb31
              firstName: João
              lastName: Silva
              whatsapp: "11999999999"
      responses:
        "200":
          description: Agendamento criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  appointmentId:
                    type: string
                    format: uuid
                  professionalId:
                    type: string
                    format: uuid
                  professionalNickname:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /appointments/last-completed:
    get:
      tags: [Agendamentos]
      operationId: getLastCompletedAppointment
      summary: Último atendimento concluído
      description: |
        Devolve o último horário já atendido (`done`) daquele WhatsApp.
        Útil no bot para lembrar serviço/barbeiro preferido e sugerir remarcar.

        **Acesso:** privada. Scope `appointments:read`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/whatsappQuery"
      responses:
        "200":
          description: Último atendimento ou não encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  found:
                    type: boolean
                  lastAppointment:
                    type: object
                    nullable: true
                    additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /appointments/{id}/status:
    parameters:
      - $ref: "#/components/parameters/appointmentId"
    put:
      tags: [Agendamentos]
      operationId: updateAppointmentStatus
      summary: Atualizar status do agendamento
      description: |
        Muda o andamento do horário na agenda, por exemplo de agendado para
        confirmado, cancelado ou atendido.

        Status aceitos: `scheduled`, `confirmed`, `cancelled`, `done`.

        **Acesso:** privada — chave com `appointments:update` ou sessão do dono.
        O cliente do site não usa esta rota (para cancelar, use DELETE).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [scheduled, confirmed, cancelled, done]
            example:
              status: confirmed
      responses:
        "200":
          description: Status atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  appointmentId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [scheduled, confirmed, cancelled, done]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /appointments/{id}:
    parameters:
      - $ref: "#/components/parameters/appointmentId"
    patch:
      tags: [Agendamentos]
      operationId: updateAppointment
      summary: Remarcar agendamento
      description: |
        Troca data, horário, barbeiro e/ou serviços de um agendamento já existente.
        O WhatsApp do body precisa ser o do dono do horário.

        **Acesso:** privada. Scope `appointments:update`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [whatsapp, professionalId, date, startTime, serviceIds]
              properties:
                whatsapp:
                  type: string
                professionalId:
                  type: string
                  format: uuid
                date:
                  type: string
                  format: date
                startTime:
                  type: string
                  example: "15:00"
                serviceIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
      responses:
        "200":
          description: Remarcado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  appointmentId:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Agendamentos]
      operationId: cancelAppointment
      summary: Cancelar agendamento
      description: |
        Cancela o horário do cliente. O registro continua no sistema com status
        `cancelled` (não apaga o histórico).

        **Acesso:** privada. Scope `appointments:cancel`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/whatsappQuery"
      responses:
        "200":
          description: Cancelado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  appointmentId:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /appointment-reminders/due:
    get:
      tags: [Lembretes]
      operationId: listDueReminders
      summary: Lembretes vencidos para disparo
      description: |
        Lista lembretes que já chegaram na hora de avisar o cliente
        (cerca de 1h antes do atendimento). O n8n consulta esta rota,
        envia a mensagem no WhatsApp e depois marca como enviado.

        **Acesso:** privada. Scope `appointment_reminders:read`.
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: now
          in: query
          description: ISO-8601 com offset (opcional, para testes)
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Lista de lembretes
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  reminders:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppointmentReminder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /appointment-reminders/pending-response:
    get:
      tags: [Lembretes]
      operationId: getPendingReminderResponse
      summary: Lembrete aguardando confirmação do cliente
      description: |
        Depois que o lembrete foi enviado, busca se aquele WhatsApp ainda tem
        um lembrete esperando a resposta do cliente (confirmar presença).

        **Acesso:** privada. Scope `appointment_reminders:read`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/whatsappQuery"
      responses:
        "200":
          description: Lembrete pendente ou null
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  found:
                    type: boolean
                  reminder:
                    oneOf:
                      - $ref: "#/components/schemas/AppointmentReminder"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /appointment-reminders/{id}/mark-sent:
    post:
      tags: [Lembretes]
      operationId: markReminderSent
      summary: Marcar lembrete como enviado
      description: |
        Confirma no sistema que a mensagem do lembrete já saiu no WhatsApp.
        Chame logo depois do envio no n8n para não disparar de novo.

        **Acesso:** privada. Scope `appointment_reminders:write`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                providerMessageId:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /appointment-reminders/{id}/confirm:
    post:
      tags: [Lembretes]
      operationId: confirmReminder
      summary: Confirmar lembrete pelo cliente
      description: |
        Quando o cliente responde confirmando o horário, marque o lembrete
        como confirmado. Assim o fluxo do bot sabe que a presença foi ok.

        **Acesso:** privada. Scope `appointment_reminders:write`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /comandas:
    get:
      tags: [Comandas]
      operationId: listOrOpenComandas
      summary: Listar comandas do dia ou abrir por agendamento
      description: |
        Duas formas de uso:
        - Com `appointmentId`: abre (ou reaproveita) a comanda daquele horário
        - Com `date`: lista as comandas do dia (pode filtrar por `status` e barbeiro)

        A comanda é a conta do cliente naquele dia (serviços, produtos, pagamento).

        **Acesso:** privada. Scope `comandas:read`.
      security:
        - BearerAuth: []
      parameters:
        - name: appointmentId
          in: query
          description: Abre/retorna a comanda ligada a este agendamento
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          description: Lista comandas deste dia (AAAA-MM-DD)
          schema:
            type: string
            format: date
        - name: status
          in: query
          description: Filtra abertas ou fechadas (só com `date`)
          schema:
            type: string
            enum: [open, closed]
        - name: professionalId
          in: query
          description: Filtra pelo barbeiro (só com `date`)
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Comanda única ou lista
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  comanda:
                    $ref: "#/components/schemas/Comanda"
                  comandas:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comanda"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /comandas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Comandas]
      operationId: getComanda
      summary: Detalhe da comanda
      description: |
        Mostra uma comanda completa: itens, valores e situação (aberta/fechada).

        **Acesso:** privada. Scope `comandas:read`.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Comanda
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  comanda:
                    $ref: "#/components/schemas/Comanda"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Comandas]
      operationId: updateComanda
      summary: Atualizar itens da comanda
      description: |
        Troca a lista de itens da comanda (serviços/produtos e preços cobrados).
        Só funciona com a comanda ainda aberta.

        **Acesso:** privada. Scope `comandas:write` (dono ou chave).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      [serviceId, serviceName, catalogPriceCents, chargedPriceCents]
                    properties:
                      serviceId:
                        type: string
                        format: uuid
                      serviceName:
                        type: string
                      catalogPriceCents:
                        type: integer
                        minimum: 0
                      chargedPriceCents:
                        type: integer
                        minimum: 0
      responses:
        "200":
          description: Comanda atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  comanda:
                    $ref: "#/components/schemas/Comanda"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /comandas/{id}/close:
    post:
      tags: [Comandas]
      operationId: closeComanda
      summary: Fechar comanda e registrar pagamento
      description: |
        Fecha a conta do cliente e registra como foi pago (Pix, dinheiro,
        cartão etc. — pode misturar valores). Depois disso a comanda fica
        fechada e entra no caixa do dia.

        **Acesso:** privada. Scope `comandas:write`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payments]
              properties:
                payments:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [paymentMethod, amountCents]
                    properties:
                      paymentMethod:
                        $ref: "#/components/schemas/PaymentMethod"
                      amountCents:
                        type: integer
                        minimum: 1
      responses:
        "200":
          description: Comanda fechada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  comanda:
                    $ref: "#/components/schemas/Comanda"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /comandas/{id}/reopen:
    post:
      tags: [Comandas]
      operationId: reopenComanda
      summary: Reabrir comanda fechada
      description: |
        Volta uma comanda fechada para aberta, para corrigir itens ou
        pagamento. Use com cuidado: pode afetar caixa e crédito do cliente.

        **Acesso:** privada. Scope `comandas:write`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmCreditShortfall:
                  type: boolean
      responses:
        "200":
          description: Comanda reaberta
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  comanda:
                    $ref: "#/components/schemas/Comanda"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Ex. shortfall de crédito
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                  code:
                    type: string
                  shortfallCents:
                    type: integer

  /finance/cash-register:
    get:
      tags: [Financeiro]
      operationId: getCashRegister
      summary: Caixa do dia
      description: |
        Resumo financeiro de um dia: quanto entrou por forma de pagamento,
        totais e situação do caixa.

        **Acesso:** privada. Scope `finance:read` (dono ou chave).
      security:
        - BearerAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Resumo do caixa
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  summary:
                    type: object
                    additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /finance/commissions:
    get:
      tags: [Financeiro]
      operationId: getCommissions
      summary: Comissões no período
      description: |
        Mostra quanto cada barbeiro tem de comissão entre duas datas
        (`from` e `to`). Opcional filtrar por um profissional.

        **Acesso:** privada. Scope `finance:read` (dono ou chave).
      security:
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: professionalId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resumo de comissões
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  summary:
                    type: object
                    additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: dbc_live_<keyId>_<secret>
      description: |
        Chave gerada em Configurações → Integrações → Chaves de API.
        Exemplo: `Authorization: Bearer dbc_live_abc_xyz`

  parameters:
    whatsappQuery:
      name: whatsapp
      in: query
      required: true
      schema:
        type: string
      example: "11999999999"
      description: WhatsApp com DDD (com ou sem 55)
    appointmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Error:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
    Professional:
      type: object
      description: |
        Dados públicos do profissional. Contato interno (e-mail, WhatsApp do barbeiro),
        nome/sobrenome e comissão não entram nesta rota pública.
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        photoUrl:
          type: string
          nullable: true
        serviceIds:
          type: array
          description: IDs dos serviços que realiza (detalhes em GET /services)
          items:
            type: string
            format: uuid
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
        priceCents:
          type: integer
          description: Menor preço da semana (referência)
        priceCentsForDate:
          type: integer
          nullable: true
          description: Preço do dia em ?date= (null sem date)
        priceFrom:
          type: boolean
        prices:
          type: array
          description: Preços agrupados por valor
          items:
            type: object
            properties:
              priceCents:
                type: integer
              weekdays:
                type: array
                items:
                  type: integer
                description: "0=Dom … 6=Sáb"
              days:
                type: array
                items:
                  type: string
                example: [Seg, Ter, Qua]
        photoUrl:
          type: string
          nullable: true
        professionalIds:
          type: array
          description: IDs dos profissionais que realizam este serviço
          items:
            type: string
            format: uuid
        professionals:
          type: array
          description: Resumo público de quem realiza (sem serviceIds aninhados)
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              nickname:
                type: string
              photoUrl:
                type: string
                nullable: true
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        whatsapp:
          type: string
          example: "5511999999999"
    PublicAppointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        professionalId:
          type: string
          format: uuid
        professionalName:
          type: string
        professionalPhotoUrl:
          type: string
          nullable: true
        professionalPhotoPosition:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        status:
          type: string
          enum: [scheduled, confirmed, cancelled, done]
        serviceIds:
          type: array
          items:
            type: string
            format: uuid
        serviceNames:
          type: array
          items:
            type: string
        totalMinutes:
          type: integer
        totalPriceCents:
          type: integer
    CreateAppointmentBody:
      type: object
      required: [date, startTime, serviceIds, firstName, lastName, whatsapp]
      properties:
        professionalId:
          type: string
          format: uuid
        anyProfessional:
          type: boolean
        date:
          type: string
          format: date
        startTime:
          type: string
          example: "10:00"
        serviceIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        firstName:
          type: string
        lastName:
          type: string
        whatsapp:
          type: string
    AppointmentReminder:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        scheduledFor:
          type: string
          format: date-time
        customer:
          type: object
          properties:
            firstName:
              type: string
            lastName:
              type: string
            whatsapp:
              type: string
        professional:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        services:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              priceCents:
                type: integer
        shop:
          type: object
          properties:
            name:
              type: string
            address:
              type: string
    PaymentMethod:
      type: string
      enum: [pix, cash, debit, credit, store_credit]
    Comanda:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [open, closed]
        totalCents:
          type: integer
        commissionCents:
          type: integer
        customerFirstName:
          type: string
        customerLastName:
          type: string
        customerWhatsapp:
          type: string
        serviceDate:
          type: string
          format: date
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        payments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              paymentMethod:
                $ref: "#/components/schemas/PaymentMethod"
              amountCents:
                type: integer

  responses:
    BadRequest:
      description: Parâmetros inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Não autorizado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            ok: false
            error: Não autorizado.
    Forbidden:
      description: Sem permissão
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            ok: false
            error: Sem permissão.
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflito de regra de negócio
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit excedido
      headers:
        Retry-After:
          schema:
            type: integer
          description: Segundos até tentar de novo
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Muitas tentativas em pouco tempo. Aguarde alguns minutos e tente de novo.
